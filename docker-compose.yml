services:
  mongo:
    image: mongo:7.0
    container_name: monolegal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - monolegal-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  monolegal-mongo-data:
